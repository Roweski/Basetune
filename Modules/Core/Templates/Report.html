<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basetune - Baseline Comparison Report</title>
<style>
{{CSS}}
</style>
</head>
<body{{BODY_CLASS}}>

<button class="theme-toggle" id="theme-toggle" tabindex="-1" aria-label="Toggle Dark Mode">
    <svg class="moon-icon" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
    <svg class="sun-icon" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.415 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"/></svg>
</button>

<div class="container">
    <header>
        <h1>Baseline Comparison Report</h1>
        {{SUBTITLE}}
    </header>

    <div class="stats-grid">
        <!-- The tiles are the status and issue filter (no dropdowns for
             those): a status tile and an issue tile combine (Diff + Conflict),
             a second click on an active tile turns it off, Total clears all
             filters but the platform (toggleCard in Report.js).
             Tab order: tiles (1-7), filters (8-10), search (11), as on screen
             (the search box is placed after the filters). The theme button
             and the page buttons are mouse-only (tabindex -1). -->
        <div tabindex="1" role="button" class="stat-card s-total"   onclick="toggleCard('', '')"          title="Show all settings (clears the filters, not the platform)"><div class="s-label">Total</div>     <div class="s-value"></div></div>
        <div tabindex="2" role="button" class="stat-card s-match"   onclick="toggleCard('status', 'Match')"   title="Filter on Match; combine with Duplicate"><div class="s-label">Match</div>     <div class="s-value"></div></div>
        <div tabindex="3" role="button" class="stat-card s-diff"    onclick="toggleCard('status', 'Diff')"    title="Filter on Diff; combine with Duplicate or Conflict"><div class="s-label">Diff</div>      <div class="s-value"></div></div>
        <div tabindex="4" role="button" class="stat-card s-missing" onclick="toggleCard('status', 'Missing')" title="Filter on Missing"><div class="s-label">Missing</div>   <div class="s-value"></div></div>
        <div tabindex="5" role="button" class="stat-card s-extra"   onclick="toggleCard('status', 'Extra')"   title="Filter on Extra; combine with Duplicate or Conflict"><div class="s-label">Extra</div>     <div class="s-value"></div></div>
        <div tabindex="6" role="button" class="stat-card s-dup"     onclick="toggleCard('issue', 'Duplicate')" title="Filter on Duplicate; combine with a status"><div class="s-label">Duplicate</div> <div class="s-value"></div></div>
        <div tabindex="7" role="button" class="stat-card s-conflict" onclick="toggleCard('issue', 'Conflict')" title="Filter on Conflict; combine with Diff or Extra"><div class="s-label">Conflict</div> <div class="s-value"></div></div>
    </div>

    <div class="filters">
        <input type="text" id="search" tabindex="11" placeholder="Search setting or policy..." oninput="applyFilters()">
        <!-- Platform: only the platforms in this compare. The tiles count for
             the chosen platform; the policy lists show its policies. -->
        <select id="filterPlatform" tabindex="8" onchange="onPlatformChange()">
            <option value="">All platforms</option>
        </select>
        <select id="filterPolicy" tabindex="9" onchange="applyFilters()">
            <option value="">All source policies</option>
        </select>
        <select id="filterTarget" tabindex="10" onchange="applyFilters()">
            <option value="">All target policies</option>
        </select>
    </div>
    <div class="row-count" id="rowCount"></div>

    <div class="content-card">
        <div class="table-wrapper">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Source Policy<span class="sort-indicator"></span></th>
                        <th onclick="sortTable(1)">Setting<span class="sort-indicator"></span></th>
                        <th onclick="sortTable(2)">Source Value<span class="sort-indicator"></span></th>
                        <th class="col-status" onclick="sortTable(3)">Status<span class="sort-indicator"></span></th>
                        <th class="col-issue"  onclick="sortTable(4)">Issue<span class="sort-indicator"></span></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="pagination" id="pagination"></div>
    </div>

    <footer>Basetune {{VERSION}} &nbsp;&middot;&nbsp; Built for the Intune community &nbsp;&middot;&nbsp; MIT License</footer>
</div>

<!-- Report rows (JSON), read by Report.js. < > & are written as \u escapes,
     so no value can close this block. -->
<script type="application/json" id="report-data">{{DATA}}</script>
<script>
{{JS}}
</script>
</body>
</html>
